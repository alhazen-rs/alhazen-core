[package]
name = "alhazen-core"
description = "Native media engine for Rust: plays video and audio from files and HTTP, with pure-Rust and OS (GPU) decoders. UI-agnostic."
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/alhazen-rs/alhazen-core"
homepage = "https://github.com/alhazen-rs"
documentation = "https://docs.rs/alhazen-core"
readme = "README.md"
keywords = ["video", "audio", "media", "player", "decoder"]
categories = ["multimedia::video", "multimedia::audio", "multimedia"]
# Test fixtures and scripts stay in the repository (crates.io packages must be small).
include = ["src/**", "examples/**", "LICENSE", "NOTICE", "README.md"]

[features]
default = ["native", "http", "audio-output", "ffmpeg-cli", "media-foundation", "nvdec", "native-aac"]
# Pure-Rust, permissively licensed decoders: AV1 (rav1d), VP9 (vp9-mt), VP8 (oximedia-codec),
# ProRes (oxideav-prores), Opus, Vorbis, FLAC (claxon); MP4/MOV demuxing.
native = ["dep:rav1d", "dep:vp9-mt", "dep:oximedia-codec", "dep:oxideav-prores", "dep:re_mp4", "dep:opus-pure", "dep:lewton", "dep:claxon"]
# AAC (LC, Main, LTP, HE-AAC v1/v2) via rusty_aac: pure Rust, Apache-2.0.
native-aac = ["dep:rusty_aac"]
http = ["dep:ureq"]
# Decode through the user's own `ffmpeg` program (found at runtime; nothing is linked). Used only
# for codecs no native decoder handles, or when native decoding is too slow (auto fallback).
ffmpeg-cli = ["dep:windows"]
# Windows' own decoders through Media Foundation (Windows only; nothing on other platforms):
# H.264, HEVC, VP9, AV1 (GPU-accelerated where supported), AAC, MP3, AC-3, E-AC-3, ALAC.
media-foundation = ["dep:windows"]
# NVIDIA's GPU decoders on Linux (NVDEC): H.264, HEVC, VP8, VP9, AV1. Loaded at runtime from the
# driver (nothing linked, no build requirements); nothing on other platforms.
nvdec = ["dep:libloading"]
# Sound output through cpal. On Linux this needs ALSA development files (libasound2-dev).
audio-output = ["dep:cpal"]

[dependencies]
thiserror = "2"
url = "2.5"
crossbeam-channel = "0.5"
rayon = "1.12"
yuv = { version = "0.8.19", features = ["rayon"] }
log = "0.4"
libc = "0.2"
vp9-mt = { version = "0.1.1", optional = true }
oximedia-codec = { version = "0.2.1", default-features = false, features = ["vp8"], optional = true }
oxideav-prores = { version = "0.1.1", optional = true }
re_mp4 = { version = "0.5.1", optional = true }
ureq = { version = "3.4", optional = true }
opus-pure = { version = "0.2.2", optional = true }
lewton = { version = "0.10.2", optional = true }
claxon = { version = "0.4.3", optional = true }
rubato = "5"
fast_image_resize = { version = "6", features = ["rayon"] }
rtrb = "0.4"
cpal = { version = "0.18", optional = true }
rusty_aac = { version = "1.1", optional = true }

# rav1d 1.1.0's crate omits `src/arm/asm-offsets.h`, so its ARM assembly cannot build: on
# aarch64 it is used without assembly (slower AV1; platform decoders take over there).
[target.'cfg(not(target_arch = "aarch64"))'.dependencies]
rav1d = { version = "1.1.0", optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
rav1d = { version = "1.1.0", optional = true, default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
md-5 = "0.10"
tiny_http = "0.12"
url = "2.5"

# Decoders are unusably slow unoptimized (tests play real-time video), so they are optimized
# even in debug builds. Apps using alhazen-core should do the same (see the README).
[profile.dev.package.rav1d]
opt-level = 3

[profile.dev.package.vp9-mt]
opt-level = 3
